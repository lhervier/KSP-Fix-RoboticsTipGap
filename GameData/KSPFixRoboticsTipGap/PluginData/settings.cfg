// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Anchors the attachment of a part hanging from the moving side of a robotic part (a docking port at the tip of a
// piston that docked, a piston attached upside down) at their attach node. Without it, that attachment pivots around
// a point beside the robotic part, up to a few metres away: under load, the part hangs away from the tip.
anchorJointAtNode = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line each time the joint of a
// robotic part is created, with its distance to the attach node.
logLevel = Info
